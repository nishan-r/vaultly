name: vaultly
description: "Vaultly — a local-first personal password manager."
publish_to: 'none'

version: 4.2.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local storage (encrypted)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Biometric / PIN auth
  local_auth: ^2.3.0

  # Navigation
  go_router: ^14.8.1

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.5.1
  csv: ^6.0.0
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4
  # Note: Using manual TypeAdapters instead of hive_generator
  # to avoid source_gen version conflict with freezed.

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
